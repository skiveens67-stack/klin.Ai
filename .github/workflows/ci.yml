name: Klin Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - chatgpt/backend-foundation

permissions:
  contents: read

concurrency:
  group: klin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Next.js production build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Commit generated dependency lockfile once
        if: github.event_name == 'push' && github.ref == 'refs/heads/chatgpt/backend-foundation'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency lockfile is already committed."
            exit 0
          fi
          git commit -m "Add npm dependency lockfile"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
